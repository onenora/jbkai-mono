# JBKaiMono Build Configuration

# Font metadata
font:
  family_name: "JBKaiMono"
  version: "1.4"
  author: "onenora"
  copyright: "Copyright (c) 2026 onenora; source fonts (JetBrains Mono, LXGW WenKai) under OFL-1.1; Nerd Fonts under MIT."
  description: "JetBrains Mono + LXGW WenKai + Symbols Nerd Font merged coding font."
  url: "https://github.com/onenora/jbkai-mono"
  license: "This font is licensed under the SIL Open Font License, Version 1.1. JetBrains Mono: OFL-1.1, LXGW WenKai: OFL-1.1, Nerd Fonts: MIT."
  license_url: "https://openfontlicense.org"

# Source fonts directory
fonts_dir: "fonts"
nerd_font: "SymbolsNerdFont-Regular.ttf"

# Styles configuration
# Standard 4 styles for coding fonts (Regular, Italic, Bold, Bold Italic)
styles:
  Regular:
    en_font: "JetBrainsMono-Regular.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Regular"
  Italic:
    en_font: "JetBrainsMono-Italic.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Italic"
  Bold:
    en_font: "JetBrainsMono-Bold.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Bold"
  BoldItalic:
    en_font: "JetBrainsMono-BoldItalic.ttf"
    cn_font: "LXGWWenKaiMonoGBScreen.ttf"
    display_name: "Bold Italic"

# Build options
build:
  styles: "Regular,Bold,Italic,BoldItalic"  # Comma-separated: use "Regular" for single font
  output_dir: "output/fonts"
  parallel: 4  # Number of parallel workers

# Glyph width configuration
width:
  monospace: false
  visual_scale: 1.08
  en_width: 600
  cn_width: 1200
